<title>Brak in Meedhuizen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one 4:3 game screen centred on a dark field, RPG Maker-style windows overlaid in DOM, touch pad underneath on phones. */
:root {
  --field: #14121c;
  --win-top: #2a3f8f;
  --win-bot: #101a4a;
  --win-edge: #e9e4d4;
  --ink: #f6f3ea;
  --muted: #a9b3d9;
  --gold: #ffd25a;
  --hp: #e0483e;
  --ep: #3fa7e0;
  --calm: #7ad46a;
  --font-ui: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-title: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--field);
  color: var(--ink);
  font-family: var(--font-ui);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
#game {
  position: relative;
  width: min(100%, 1024px, calc((100dvh - 24px - var(--pad-h, 0px)) * 4 / 3));
  aspect-ratio: 4 / 3;
  max-width: 100%;
  container-type: inline-size;
  background: #000;
  box-shadow: 0 0 0 3px #000, 0 0 0 6px #3a3550, 0 20px 60px rgba(0,0,0,.6);
  border-radius: 4px;
  overflow: hidden;
}
#screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.ui { position: absolute; font-size: 3.1cqw; line-height: 1.3; box-sizing: border-box; }

/* RPG Maker window */
.win {
  background: linear-gradient(180deg, var(--win-top), var(--win-bot));
  border: 0.45cqw solid var(--win-edge);
  border-radius: 1cqw;
  box-shadow: inset 0 0 0 0.3cqw #0a0f2e, 0 0.6cqw 0 rgba(0,0,0,.35);
  padding: 1.6cqw 2.4cqw;
  color: var(--ink);
  text-shadow: 0.25cqw 0.25cqw 0 #000;
}
#dialog { left: 2%; right: 2%; bottom: 2.5%; min-height: 21%; }
#dialog .name {
  position: absolute; top: -5.2cqw; left: 2cqw;
  font-family: var(--font-title); font-size: 2.6cqw; padding: 0.6cqw 1.8cqw;
}
#dialog .text { white-space: pre-wrap; }
#dialog .more { position: absolute; right: 2.4cqw; bottom: 1cqw; color: var(--gold); animation: bob .6s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(0.6cqw); } }

.list { display: flex; flex-direction: column; gap: 0.4cqw; }
.list .opt { padding: 0.3cqw 1.2cqw 0.3cqw 3cqw; position: relative; border-radius: 0.6cqw; cursor: pointer; }
.list .opt.sel { background: rgba(255,255,255,.14); }
.list .opt.sel::before { content: "▶"; position: absolute; left: 0.6cqw; color: var(--gold); }
.list .opt.off { color: #7b84ab; }
.list .opt .r { float: right; color: var(--gold); margin-left: 2cqw; }

#choices { right: 2%; bottom: 31%; min-width: 34%; max-width: 70%; }
#menu { left: 2%; top: 3%; width: 30%; }
#panel { left: 34%; top: 3%; right: 2%; bottom: 3%; overflow: hidden; }
#panel h3 { font-family: var(--font-title); font-size: 3cqw; margin: 0 0 1.2cqw; color: var(--gold); font-weight: 400; }
#panel .q { margin-bottom: 1.4cqw; }
#panel .q b { font-weight: 600; }
#panel .q.done { color: #8f98bd; }
#panel .q.done b::after { content: "  ✔"; color: var(--calm); }
#panel .q small { display: block; color: var(--muted); font-size: 2.6cqw; }
#hud { left: 2%; top: 3%; font-size: 2.6cqw; padding: 0.8cqw 1.8cqw; }
#toast { left: 50%; top: 4%; transform: translateX(-50%); font-size: 2.7cqw; padding: 0.8cqw 2.4cqw; white-space: nowrap; }

/* Battle */
#bstats { right: 2%; bottom: 2.5%; width: 31%; font-size: 2.7cqw; }
#bcmd { left: 2%; bottom: 2.5%; width: 23%; font-size: 2.8cqw; }
#bsub { left: 26.5%; bottom: 2.5%; width: 39%; max-height: 50%; overflow: hidden; font-size: 2.6cqw; }
#blog { left: 2%; right: 2%; top: 3%; min-height: 12%; font-size: 2.8cqw; }
#benemy { right: 2%; top: 19%; width: 30%; padding: 1cqw 2cqw; font-size: 2.4cqw; }
.bar { height: 1.3cqw; background: #0a0f2e; border: 0.25cqw solid #000; border-radius: 0.5cqw; overflow: hidden; margin: 0.3cqw 0 0.8cqw; }
.bar i { display: block; height: 100%; transition: width .35s; }
.bar.hp i { background: var(--hp); }
.bar.ep i { background: var(--ep); }
.bar.calm i { background: var(--calm); }
.row { display: flex; justify-content: space-between; gap: 2cqw; font-variant-numeric: tabular-nums; }
.lbl { color: var(--muted); }

/* Title + end */
#title, #ending {
  inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqw;
  background: radial-gradient(ellipse at 50% 30%, rgba(30,30,60,.2), rgba(8,6,16,.85));
  text-align: center;
}
#title h1, #ending h1 {
  font-family: var(--font-title); font-weight: 700; margin: 0;
  font-size: 7.4cqw; line-height: 1; color: var(--gold);
  text-shadow: 0.5cqw 0.5cqw 0 #6a2b14, 1cqw 1cqw 0 #000;
  letter-spacing: 0.2cqw;
}
#title .sub, #ending .sub { font-size: 3cqw; color: var(--ink); text-shadow: 0.3cqw 0.3cqw 0 #000; max-width: 80%; }
#title .list { min-width: 38%; }
#title .hint { font-size: 2.2cqw; color: var(--muted); position: absolute; bottom: 3%; }
#ending { background: #000; }
#ending .sub { white-space: pre-wrap; }

#fade { inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; }
#fade.on { opacity: 1; }

/* Touch pad */
#pad { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; }
@media (pointer: coarse) { #pad { display: flex; } :root { --pad-h: 150px; } }
.dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
.pbtn {
  border: 3px solid #3a3550; background: #262238; color: var(--ink); border-radius: 10px;
  font: 600 16px var(--font-title); touch-action: none;
}
.pbtn:active, .pbtn.down { background: #3d3758; }
.ab { display: flex; gap: 14px; align-items: center; }
.ab .pbtn { width: 62px; height: 62px; border-radius: 50%; }
.ab .a { background: #6a2b14; border-color: #a4462a; }
button:focus-visible, .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #dialog .more { animation: none; } #fade { transition: none; } }
</style>

<div id="game">
  <canvas id="screen" width="320" height="240" aria-label="Spelscherm"></canvas>
  <div id="hud" class="ui win" hidden></div>
  <div id="toast" class="ui win" hidden></div>

  <div id="benemy" class="ui win" hidden></div>
  <div id="blog" class="ui win" hidden></div>
  <div id="bcmd" class="ui win list" hidden></div>
  <div id="bsub" class="ui win list" hidden></div>
  <div id="bstats" class="ui win" hidden></div>

  <div id="menu" class="ui win list" hidden></div>
  <div id="panel" class="ui win" hidden></div>

  <div id="dialog" class="ui win" hidden>
    <div class="name win" hidden></div>
    <div class="text"></div>
    <div class="more" hidden>▼</div>
  </div>
  <div id="choices" class="ui win list" hidden></div>

  <div id="title" class="ui">
    <h1>BRAK IN<br>MEEDHUIZEN</h1>
    <div class="sub">Je wordt wakker in een schuur. Je hoofd bonkt. Je weet niet meer hoe je heet.</div>
    <div class="list win" id="titlemenu"></div>
    <div class="hint">Pijltjes / WASD: lopen · Spatie / Enter: oké · Esc / X: menu</div>
  </div>
  <div id="ending" class="ui" hidden>
    <h1>EINDE</h1>
    <div class="sub"></div>
  </div>
  <div id="fade" class="ui"></div>
</div>

<div id="pad" aria-hidden="true">
  <div class="dpad">
    <span></span><button class="pbtn" data-k="up">▲</button><span></span>
    <button class="pbtn" data-k="left">◀</button><span></span><button class="pbtn" data-k="right">▶</button>
    <span></span><button class="pbtn" data-k="down">▼</button><span></span>
  </div>
  <div class="ab">
    <button class="pbtn b" data-k="cancel">B</button>
    <button class="pbtn a" data-k="ok">A</button>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/maps.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/story.js"></script>
<script src="js/story2.js"></script>
<script src="js/main.js"></script>
